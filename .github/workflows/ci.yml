name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [master]
    paths-ignore: &paths-ignore
      - "CHANGELOG.md"
      - "LICENSE"
      # AI assistant instruction files
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursor/**"
      - ".github/copilot-instructions.md"
      - ".github/ai-context/**"
      - ".github/instructions/**"
      # GitHub/editor meta files
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".vscode/**"
      - ".editorconfig"
      - ".spelling"
  push:
    branches: [master]
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-powershell

      - run: Invoke-Build -Task Lint
        shell: pwsh

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-powershell

      - run: Invoke-Build -File ./AtlassianPS.Standards.build.ps1 -Task Build
        shell: pwsh

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Release
          path: ./Release/

  test_windows_ps5:
    name: Test (Windows PS5)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-powershell
        with:
          ps-version: "5"
          # Setup is run below in the powershell (PS 5.1) shell instead of pwsh,
          # so the Windows PowerShell module path is populated.
          skip-setup: "true"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Release
          path: ./Release/

      - name: Setup
        shell: powershell
        run: |
          ./Tools/setup.ps1
          Invoke-Build -Task ShowDebugInfo

      - run: Invoke-Build -Task Test
        shell: powershell

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: Windows-PS5-Unit-Tests
          path: Test*.xml

  test_pwsh:
    name: Test (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: "Windows PS7" }
          - { os: ubuntu-latest, name: "Ubuntu" }
          - { os: macos-latest, name: "macOS" }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-powershell

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Release
          path: ./Release/

      - run: Invoke-Build -Task Test
        shell: pwsh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.name }}-Unit-Tests
          path: Test*.xml

  provenance:
    name: Package and attest tested artifact
    needs: [build, test_windows_ps5, test_pwsh]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-powershell

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Release
          path: ./Release/

      - name: Package tested artifact and create provenance
        shell: pwsh
        run: |
          Invoke-Build -Task Provenance `
            -SourceRepository '${{ github.repository }}' `
            -SourceCommitSha '${{ github.sha }}' `
            -SourceRef '${{ github.ref }}' `
            -RunId '${{ github.run_id }}'
          Test-AtlassianPSModulePackage `
            -BuildOutputPath ./Release `
            -ModuleName AtlassianPS.Standards `
            -PackagePath ./Release/AtlassianPS.Standards.zip

      - name: Attest tested package
        id: attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: ./Release/AtlassianPS.Standards.zip

      - name: Include attestation bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination ./Release/AtlassianPS.Standards.intoto.jsonl

      - name: Upload commit-specific verified release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Verified-Release-${{ github.sha }}
          path: ./Release/
          if-no-files-found: error

  ci-required:
    name: CI Result
    if: always()
    needs: [lint, build, test_windows_ps5, test_pwsh, provenance]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        shell: bash
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results:"
          echo "$results"
          if echo "$results" | grep -E '"result":[[:space:]]*"(failure|cancelled)"' > /dev/null; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
