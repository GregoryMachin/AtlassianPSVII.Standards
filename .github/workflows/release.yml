name: Create Release and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (for manual reruns)"
        required: true
        type: string
      skip_psgallery_publish:
        description: "Skip PSGallery publish when recovering a GitHub release after the package already exists"
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Resolve release ref
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${{ github.ref_name }}"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag '$release_tag' does not match the expected v-prefixed version pattern."
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
            echo "::error::Release ref '$release_tag' is not a tag."
            exit 1
          fi

          tag_type="$(git cat-file -t "refs/tags/$release_tag")"
          if [ "$tag_type" != "tag" ]; then
            echo "::error::Release tag '$release_tag' must be an annotated tag."
            exit 1
          fi

          git fetch --no-tags origin master

          release_sha="$(git rev-list -n 1 "$release_tag")"
          if ! git merge-base --is-ancestor "$release_sha" "origin/master"; then
            echo "::error::Release tag '$release_tag' does not point to a commit reachable from origin/master."
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Download artifact from commit that got tagged
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ci.yml
          workflow_conclusion: success
          commit: ${{ steps.release_ref.outputs.release_sha }}
          name: Release
          path: ./Release/
          if_no_artifact_found: fail

      - uses: ./.github/actions/setup-powershell

      - uses: ./.github/actions/build-release-notes
        id: release_notes
        with:
          release-version: ${{ steps.release_ref.outputs.release_tag }}
          module-path: ./AtlassianPS.Standards/AtlassianPS.Standards.psd1

      - name: Publish module
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_psgallery_publish }}
        run: Invoke-Build -Task Publish -VersionToPublish ${{ steps.release_ref.outputs.release_tag }} -PSGalleryAPIKey ${{ secrets.PSGALLERY_API_KEY }}
        shell: pwsh

      - name: Skip PSGallery publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_psgallery_publish }}
        run: |
          echo "Skipping PSGallery publish for recovery rerun."
        shell: bash

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_ref.outputs.release_tag }}
          name: ${{ steps.release_ref.outputs.release_tag }}
          body_path: ${{ steps.release_notes.outputs.release_notes_path }}
          files: ./Release/AtlassianPS.Standards.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.release_ref.outputs.release_tag, 'alpha') || contains(steps.release_ref.outputs.release_tag, 'beta') || contains(steps.release_ref.outputs.release_tag, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
