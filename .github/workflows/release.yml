name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (for manual reruns)"
        required: true
        type: string

jobs:
  publish-and-release:
    name: Publish and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup build dependencies
        shell: pwsh
        run: ./Tools/setup.ps1

      - name: Build release artifact
        shell: pwsh
        run: Invoke-Build -File ./AtlassianPS.Standards.build.ps1 -Task Build

      - name: Publish to PowerShell Gallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        if: env.PSGALLERY_API_KEY != ''
        shell: pwsh
        run: |
          Publish-Module -Path ./Release/AtlassianPS.Standards -NuGetApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop

      - name: Package release zip
        shell: pwsh
        run: |
          Compress-Archive -Path ./Release/AtlassianPS.Standards/* -DestinationPath ./Release/AtlassianPS.Standards.zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: ./Release/AtlassianPS.Standards.zip
          generate_release_notes: true
